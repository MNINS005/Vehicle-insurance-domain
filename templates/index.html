<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Insurance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<div class="container">

    <h1>Vehicle Insurance Prediction</h1>

    <form method="post" action="/">

        <details>
            <summary>Gender</summary>
            <div class="field-content">
                <label>1 = Male, 0 = Female</label>
                <select name="Gender" required>
                    <option value="">Select</option>
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>
        </details>

        <details>
            <summary>Age</summary>
            <div class="field-content">
                <input type="number" name="Age" required>
            </div>
        </details>

        <details>
            <summary>Driving License</summary>
            <div class="field-content">
                <label>1 = Yes, 0 = No</label>
                <select name="Driving_License" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
        </details>

        <details>
            <summary>Region Code</summary>
            <div class="field-content">
                <input type="number" step="0.01" name="Region_Code" required>
            </div>
        </details>

        <details>
            <summary>Previously Insured</summary>
            <div class="field-content">
                <label>1 = Yes, 0 = No</label>
                <select name="Previously_Insured" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
        </details>

        <details>
            <summary>Annual Premium</summary>
            <div class="field-content">
                <input type="number" step="0.01" name="Annual_Premium" required>
            </div>
        </details>

        <details>
            <summary>Policy Sales Channel</summary>
            <div class="field-content">
                <input type="number" step="0.01" name="Policy_Sales_Channel" required>
            </div>
        </details>

        <details>
            <summary>Vintage</summary>
            <div class="field-content">
                <input type="number" name="Vintage" required>
            </div>
        </details>

        <details>
            <summary>Vehicle Age &lt; 1 Year</summary>
            <div class="field-content">
                <label>1 = Yes, 0 = No</label>
                <select name="Vehicle_Age_lt_1_Year" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
        </details>

        <details>
            <summary>Vehicle Age &gt; 2 Years</summary>
            <div class="field-content">
                <label>1 = Yes, 0 = No</label>
                <select name="Vehicle_Age_gt_2_Years" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
        </details>

        <details>
            <summary>Vehicle Damage</summary>
            <div class="field-content">
                <label>1 = Yes, 0 = No</label>
                <select name="Vehicle_Damage_Yes" required>
                    <option value="">Select</option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>
        </details>

        <button type="submit" class="predict-btn">
            Predict Insurance Response
        </button>
    </form>

    <form method="get" action="/train">
        <button type="submit" class="train-btn">
            Train Model
        </button>
    </form>

    {% if context != "Rendering" %}
        <div class="result">
            Prediction: {{ context }}
        </div>
    {% endif %}

</div>

</body>
</html>
